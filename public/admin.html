<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUZ Interiors - Admin Panel testing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="login-section" class="login-container">
        <form id="login-form" class="login-form">
            <h2>Admin Login</h2>
            <p>Enter your credentials</p>
            <div id="login-message"></div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <h1>RUZ Admin Panel</h1>
                    </div>
                    <button id="logout-btn" class="logout-btn">Logout</button>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="dashboard-grid">
                <div class="dashboard-section">
                    <h2 class="section-title">Add Project</h2>
                    <div id="project-message"></div>
                    <form id="project-form">
                        <div class="form-group">
                            <label>Project Title</label>
                            <input type="text" id="project-title" required>
                        </div>
                        <div class="form-group">
                            <label>Before Image</label>
                            <input type="file" id="before-image" accept="image/*" required>
                        </div>
                        <div class="form-group">
                            <label>After Image</label>
                            <input type="file" id="after-image" accept="image/*" required>
                        </div>
                        <button type="submit" class="submit-btn">Upload Project</button>
                    </form>
                </div>

                <div class="dashboard-section">
                    <h2 class="section-title">Add Completed Work</h2>
                    <div id="completed-work-message"></div>
                    <form id="completed-work-form">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="completed-work-title" required>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="completed-work-description" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="completed-work-category" required></select>
                        </div>
                        <div class="form-group">
                            <label>Image</label>
                            <input type="file" id="completed-work-image" accept="image/*" required>
                        </div>
                        <button type="submit" class="submit-btn">Upload Completed Work</button>
                    </form>
                </div>
            </div>

            <div class="list-section">
                <h2 class="section-title">Projects</h2>
                <div id="projects-list"></div>
            </div>

            <div class="list-section">
                <h2 class="section-title">Reviews</h2>
                <div id="reviews-list"></div>
            </div>

            <div class="list-section">
                <h2 class="section-title">Completed Works</h2>
                <div id="completed-works-list"></div>
            </div>

            <div class="list-section">
                <h2 class="section-title">Completed Work Categories</h2>
                <div id="category-message"></div>
                <form id="category-form">
                    <div class="form-group">
                        <label>New Category</label>
                        <input type="text" id="new-category-name" required>
                    </div>
                    <button type="submit" class="submit-btn">Add Category</button>
                </form>
                <div id="category-list"></div>
            </div>
        </div>
    </div>

    <div id="edit-project-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeEditProject()">&times;</button>
            <h2 class="section-title" style="margin-bottom: 20px;">Edit Project</h2>
            
            <div id="edit-project-message"></div>
            
            <form id="edit-project-form">
                <input type="hidden" id="edit-project-id">
                
                <div class="form-group">
                    <label>Project Title</label>
                    <input type="text" id="edit-project-title" required>
                </div>
                
                <div class="form-group">
                    <label>New Before Image <span style="font-size: 12px; font-weight: normal; color: var(--light-text);">(leave empty to keep current)</span></label>
                    <input type="file" id="edit-before-image" accept="image/*">
                </div>
                
                <div class="form-group">
                    <label>New After Image <span style="font-size: 12px; font-weight: normal; color: var(--light-text);">(leave empty to keep current)</span></label>
                    <input type="file" id="edit-after-image" accept="image/*">
                </div>
                
                <button type="submit" class="submit-btn">Save Changes</button>
                <button type="button" onclick="closeEditProject()" class="submit-btn" style="background-color: var(--light-text); margin-top: 10px;">Cancel</button>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
