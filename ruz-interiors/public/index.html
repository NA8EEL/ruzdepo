<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUZ Interiors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">RUZ Interiors</div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#reviews">Reviews</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Transform Your Space with RUZ Interiors</h1>
        <p>Expert interior design solutions tailored to your needs.</p>
    </section>

    <section class="before-after">
        <h2>Before & After</h2>
        <div class="slider-container">
            <div class="image-container">
                <img src="uploads/before-image.jpg" alt="Before" class="before-image">
                <img src="uploads/after-image.jpg" alt="After" class="after-image">
            </div>
            <input type="range" min="0" max="100" value="50" class="slider" id="slider">
        </div>
    </section>

    <section class="reviews" id="reviews">
        <h2>Client Testimonials</h2>
        <div class="reviews-container">
            <!-- Reviews will be dynamically inserted here -->
        </div>
    </section>

    <footer>
        <p>&copy; 2023 RUZ Interiors. All rights reserved.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
